  - platform: integration
    name: "BMS Total Lifetime Discharge"
    id: bms_total_lifetime_discharge
    sensor: discharging_power_sensor # <-- Point to your raw discharge power sensor
    time_unit: h
    integration_method: left
    accuracy_decimals: 1
    unit_of_measurement: "Wh"
    device_class: energy
    icon: "mdi:lightning-bolt"

  # Lifetime Non-Resetting Charge Accumulator
  - platform: integration
    name: "BMS Total Lifetime Charge"
    id: bms_total_lifetime_charge
    sensor: charging_power_sensor # <-- Point to your raw charge power sensor
    time_unit: h
    integration_method: left
    accuracy_decimals: 1
    device_class: energy
    unit_of_measurement: "Wh"
    icon: "mdi:battery-arrow-up"

  - platform: homeassistant
    entity_id: sensor.inverter_monitor_bms_capacity_remaining
    id: capacity_remaining
    internal: true
    on_value:
      then:
        - component.update: precise_soc
  - platform: homeassistant
    entity_id: sensor.inverter_monitor_bms_full_charge_capacity
    id: full_charge_capacity
    internal: true
    on_value:
      then:
        - component.update: precise_soc
  - platform: homeassistant
    entity_id: sensor.inverter_monitor_bms_state_of_charge
    id: state_of_charge
    internal: true
    on_value:
      then:
        - component.update: precise_soc
  - platform: template
    name: "BMS SOC"
    id: precise_soc
    device_class: battery
    state_class: total
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s # Fallback timeframe to recalculate safely
    lambda: |-
      if (isnan(id(capacity_remaining).state) || isnan(id(full_charge_capacity).state)) {
        if (!isnan(id(state_of_charge).state)) {
          return id(state_of_charge).state;
        }
        return {}; // Return absolutely nothing (prevents "nan %" log spam)
      }
      if (id(capacity_remaining).state > 0 && id(full_charge_capacity).state > 0) {
        return (id(capacity_remaining).state / id(full_charge_capacity).state) * 100.0;
      }
      if (!std::isnan(id(state_of_charge).state)) {
        return id(state_of_charge).state; 
      }
      return {};

