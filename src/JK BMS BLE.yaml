    key: "nWzWXgO5FZltgYLQihO93lVXDpBVkFvObnQz2FZFA60="
  reboot_timeout: 15min # Prevents the ESP32 from rebooting if Wi-Fi glitches briefly

ota:
  - platform: esphome
    encryption:

preferences:
  flash_write_interval: 60min


time:
  - platform: sntp
    id: sntp_time
    on_time:
      # ==========================================
      # DAILY CYCLE RESETS
      # ==========================================
      # CHARGE DAILY: Runs every night at 23:00
      - seconds: 0
        minutes: 0
        hours: 23
        then:
          - sensor.template.publish:
              id: bms_daily_charge_meter
              state: 0.0

      # DISCHARGE DAILY: Runs every morning at 07:00
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - sensor.template.publish:
              id: bms_daily_discharge_meter
              state: 0.0

      # ==========================================
      # MONTHLY RESETS
      # ==========================================
      # CHARGE MONTHLY: Runs at 23:00 on the LAST day of every month
      # (Clears out the old month right before the night charge window starts)
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 28,29,30,31
        then:
          # This lambda ensures it only fires if tomorrow is the 1st of the month
          - lambda: |-
              auto t = id(sntp_time).now();
              t.increment_day();
              if (t.day_of_month == 1) {
                id(bms_monthly_charge_meter).publish_state(0.0);
              }

      # DISCHARGE MONTHLY: Runs at 07:00 on the 1st day of every month
      # (Clears out the old month right before the morning discharge window starts)
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 1
        then:
          - sensor.template.publish:
              id: bms_monthly_discharge_meter
              state: 0.0

      # ==========================================
      # YEARLY RESETS
      # ==========================================
      # CHARGE YEARLY: Runs at 23:00 on December 31st
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 31
        months: DEC
        then:
          - sensor.template.publish:
              id: bms_yearly_charge_meter
              state: 0.0

      # DISCHARGE YEARLY: Runs at 07:00 on January 1st
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 1
        months: JAN
        then:
          - sensor.template.publish:
              id: bms_yearly_discharge_meter
              state: 0.0


