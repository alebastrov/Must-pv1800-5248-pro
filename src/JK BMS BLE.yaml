  local: true

esphome:
  name: esp32-s3
  friendly_name: JK BMS

esp32_ble_tracker:
  scan_parameters:
    duration: 5s
    interval: 150ms
    window: 120ms
    active: true

ble_client:
  mac_address: ${mac_address}
  id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0
