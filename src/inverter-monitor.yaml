  - platform: homeassistant
    entity_id: sensor.local_capacity_remaining
    id: capacity_remaining
    internal: true
    on_value:
      then:
        - component.update: precise_soc
  - platform: homeassistant
    entity_id: sensor.local_full_charge_capacity
    id: full_charge_capacity
    internal: true
    on_value:
      then:
        - component.update: precise_soc
  - platform: homeassistant
    entity_id: sensor.bms_state_of_charge
    id: state_of_charge
    internal: true
    on_value:
      then:
        - component.update: precise_soc

  - platform: template
    name: "BMS SOC"
    id: precise_soc
    device_class: battery
    state_class: total
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s # Fallback timeframe to recalculate safely
    lambda: |-
      if (isnan(id(local_capacity_remaining).state) || isnan(id(local_full_charge_capacity).state)) {
        if (!isnan(id(state_of_charge).state)) {
          return id(state_of_charge).state;
        }
        return {}; // Return absolutely nothing (prevents "nan %" log spam)
      }
      if (id(local_capacity_remaining).state > 0 && id(local_full_charge_capacity).state > 0) {
        return (id(local_capacity_remaining).state / id(local_full_charge_capacity).state) * 100.0;
      }
      if (!std::isnan(id(state_of_charge).state)) {
        return id(state_of_charge).state; 
      }
      return {};

