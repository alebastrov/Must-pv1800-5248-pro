script:
  # Automation script to ensure the Inverter charging current never exceeds the allowed max BMS charging current
  # without that the inverter gives #03 error and refuses to charge the battery, as BMS disconnects battery from charger
  # and inverter sees drastically increasing charging voltage
  - id: control_inverter_charging_current
    mode: restart
    then:
      - if:
          condition:
              lambda: |-
                if (id(target_charging_current_select).current_option().empty() || 
                    std::isnan(id(max_charge_current).state)) {
                  return false;
                }
                return true;
          then:
              - number.set:
                  id: inverter_charger_current
                  value: !lambda |-
                    const char* selected_str = id(target_charging_current_select).current_option().c_str();
                    float selected_target = ::atof(selected_str);
                    float max_allowed = id(max_charge_current).state;

                    // Return the lowest value between the user's choice and the BMS safety limit
                    if (selected_target > max_allowed) {
                      return max_allowed;
                    }
                    return selected_target;
  # Automated Safeguard: Monitors real-time cell parameters and intercepts changes to the BMS calibration targets.
  # Proactive Boundary Enforcement: Automatically clamps the user-configured cell_soc100_voltage down to the hardware max_cell_voltage if it overshoots.
  # Low-End Protection: Instantly forces cell_soc0_voltage up to the hardware min_cell_voltage if the target drops below live safe limits.
  - id: validate_soc_voltages
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              if (id(is_updating)) return false; 

              // CRITICAL BOOT FILTER: Exit immediately if any slider or live telemetry reads 0.0 or NaN
              if (std::isnan(id(live_min_cell_voltage).state) || id(live_min_cell_voltage).state < 1.0f ||
                  std::isnan(id(live_max_cell_voltage).state) || id(live_max_cell_voltage).state < 1.0f ||
                  std::isnan(id(min_safe_cell_voltage).state) || id(min_safe_cell_voltage).state < 1.0f ||
                  std::isnan(id(cell_soc100_voltage).state) || id(cell_soc100_voltage).state < 1.0f || 
                  std::isnan(id(cell_soc0_voltage).state) || id(cell_soc0_voltage).state < 1.0f ||
                  std::isnan(id(balancing_start_voltage).state) || id(balancing_start_voltage).state < 1.0f) {
                return false; 
              }
              return true;
          then:
            - lambda: |-
                float live_min = id(live_min_cell_voltage).state;
                float live_max = id(live_max_cell_voltage).state;
                float min_safe = id(min_safe_cell_voltage).state;
                float soc100 = id(cell_soc100_voltage).state;
                float soc0 = id(cell_soc0_voltage).state;
                float bal_start = id(balancing_start_voltage).state;

                // 1. Validate SOC 100% Voltage (Strict limits)
                if (soc100 > live_max) {
                  float target_soc100 = std::min(live_max, 3.500f); 
                  if (target_soc100 < 3.300f) target_soc100 = 3.300f;

                  if (std::abs(soc100 - target_soc100) > 0.001f) {
                    ESP_LOGW("safety", "SOC 100%% voltage (%.3fV) exceeds Max Cell (%.3fV). Clamping to %.3fV.", soc100, live_max, target_soc100);
                    id(is_updating) = true; 
                    auto call = id(cell_soc100_voltage).make_call();
                    call.set_value(target_soc100);
                    call.perform();
                    id(is_updating) = false;
                  }
                }

                // 2. Validate SOC 0% Voltage (Strictly hard-clamped to your component UI max boundary of 3.150V)
                if (soc0 < live_min) {
                  float target_soc0 = std::min(live_min, 3.150f); 
                  if (target_soc0 < 2.500f) target_soc0 = 2.500f;

                  if (std::abs(soc0 - target_soc0) > 0.001f) {
                    ESP_LOGW("safety", "SOC 0%% voltage (%.3fV) drops below Min Cell (%.3fV). Clamping to safe UI max %.3fV.", soc0, live_min, target_soc0);
                    id(is_updating) = true; 
                    auto call = id(cell_soc0_voltage).make_call();
                    call.set_value(target_soc0);
                    call.perform();
                    id(is_updating) = false;
                  }
                }

                // 3. Validate Balancing Start Voltage
                if (bal_start < min_safe) {
                  float target_bal = std::max(min_safe, 3.200f);
                  if (target_bal > 3.600f) target_bal = 3.600f;

                  if (std::abs(bal_start - target_bal) > 0.001f) {
                    ESP_LOGW("safety", "Balancing start (%.3fV) below floor (%.3fV). Clamping to %.3fV.", bal_start, min_safe, target_bal);
                    id(is_updating) = true; 
                    auto call = id(balancing_start_voltage).make_call();
                    call.set_value(target_bal);
                    call.perform();
                    id(is_updating) = false;
                  }
                } else if (bal_start > soc100) {
                  float target_bal = std::min(soc100, 3.600f);
                  if (target_bal < 3.200f) target_bal = 3.200f;

                  if (std::abs(bal_start - target_bal) > 0.001f) {
                    ESP_LOGW("safety", "Balancing start (%.3fV) exceeds SOC 100%% (%.3fV). Clamping to %.3fV.", bal_start, soc100, target_bal);
                    id(is_updating) = true; 
                    auto call = id(balancing_start_voltage).make_call();
                    call.set_value(target_bal);
                    call.perform();
                    id(is_updating) = false;
                  }
                }
  #
  - id: check_cell_delta_safety
    mode: restart
    then:
      - if:
          condition:
              lambda: |-
                // Safe exit if live telemetry numbers are not ready yet
                if (std::isnan(id(live_max_cell_voltage).state) || 
                    std::isnan(id(live_min_cell_voltage).state) ||
                    std::isnan(id(inverter_charger_current).state) ||
                    std::isnan(id(max_balance_current).state)) {
                  return false;
                }
                return true;
          then:
              - lambda: |-
                  float cell_delta = id(live_max_cell_voltage).state - id(live_min_cell_voltage).state;

                  // 1. RECOVERY RULE: If delta drops to 5mV or less, double the current capability
                  if (cell_delta <= 0.005f && id(delta_safety_multiplier) < 1.0f) {
                    float original_current = id(inverter_charger_current).state / id(delta_safety_multiplier);
                    id(delta_safety_multiplier) *= 2.0f;
                    if (id(delta_safety_multiplier) > 1.0f) id(delta_safety_multiplier) = 1.0f;

                    float new_target = original_current * id(delta_safety_multiplier);
                    ESP_LOGI("safety", "Cells balanced (%.3fV). Increasing inverter current to %.1fA", cell_delta, new_target);

                    auto call = id(inverter_charger_current).make_call();
                    call.set_value(new_target);
                    call.perform();
                  }

                  // 2. TIMING TRIGGER: Start 1-minute window if imbalance exceeds 40mV
                  if (cell_delta > 0.040f) {
                    if (!id(delta_safety_timer).is_running()) {
                      id(delta_safety_timer).execute();
                    }
                  } else {
                    id(delta_safety_timer).stop(); // Disarm countdown if variance drops early
                  }

  - id: delta_safety_timer
    mode: single
    then:
        - delay: 60s
        - lambda: |-
            float cell_delta = id(live_max_cell_voltage).state - id(live_min_cell_voltage).state;
            float current_setting = id(inverter_charger_current).state;
            float balance_floor = id(max_balance_current).state;

            // If delta is still high after 1 minute, execute a 50% current cut
            if (cell_delta > 0.040f && current_setting > balance_floor) {
              id(delta_safety_multiplier) *= 0.5f;
              float new_target = current_setting * 0.5f;

              // Stop dropping if we hit or cross the max balance current threshold
              if (new_target < balance_floor) {
                new_target = balance_floor;
              }

              ESP_LOGW("safety", "Cell delta sustained >40mV for 1 min (%.3fV). Dropping current to %.1fA", cell_delta, new_target);

              auto call = id(inverter_charger_current).make_call();
              call.set_value(new_target);
              call.perform();
            }