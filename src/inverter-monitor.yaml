# Board: NodeMCU-32S (NodeMCU)
# Definition: definitions/boards/nodemcu-32s/manifest.yaml
substitutions:
  mac_address: c8:47:80:13:ee:55
  inverter_id: inverter1
  updates_inverter: 2000ms
  updates_bms: 2000ms

external_components:
  # - source:
  #     type: git
  #     url: https://github.com/syssi/esphome-jk-bms
  #     ref: main
  - source:
      type: local
      path: components
      #url: https://github.com/syssi/esphome-jk-bms

esphome:
  name: must-pv1800
  friendly_name: inverter-monitor

esp32:
  variant: ESP32
  board: nodemcu-32s
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

api:
  encryption:
    key: "QH6ezYpMxSAzm8qHo1hbwjpCY1EM/hKUbNftqaC3vwE="
  reboot_timeout: 15min # Prevents the ESP32 from rebooting if Wi-Fi glitches briefly

ota:
  - platform: esphome
    encryption:

preferences:
  flash_write_interval: 60min

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:
  level: INFO
  hardware_uart: UART0
  logs:
    modbus: INFO
    modbus_controller: INFO

esp32_ble_tracker:
  scan_parameters:
    duration: 5s
    interval: 150ms
    window: 120ms
    active: true

ble_client:
  mac_address: ${mac_address}
  id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0
    update_interval: ${updates_bms}

web_server:
  port: 80
  local: true

status_led:
  pin: GPIO2

uart:
  - id: uart_inverter
    baud_rate: 19200
    rx_buffer_size: 384
    tx_pin: GPIO23
    rx_pin: GPIO22
    stop_bits: 1
    parity: NONE

modbus:
  - id: modbus_0
    uart_id: uart_inverter
    send_wait_time: 200ms
    turnaround_time: 80ms

modbus_controller:
  - id: must_inverter
    address: 0x04
    modbus_id: modbus_0
    setup_priority: -10
    max_cmd_retries: 2
    update_interval: ${updates_inverter}
    command_throttle: 150ms
  - id: must_inverter_slow
    address: 0x04
    modbus_id: modbus_0
    setup_priority: -10
    max_cmd_retries: 5
    update_interval: 30s
  - id: must_inverter_super_slow
    address: 0x04
    modbus_id: modbus_0
    setup_priority: -10
    max_cmd_retries: 5
    update_interval: 15min # Reads only once every 15 minutes!

time:
  - platform: sntp
    id: sntp_time
    on_time:
      # ==========================================
      # DAILY CYCLE RESETS
      # ==========================================
      # CHARGE DAILY: Runs every night at 23:00
      - seconds: 0
        minutes: 0
        hours: 23
        then:
          - sensor.template.publish:
              id: bms_daily_charge_meter
              state: 0.0

      # DISCHARGE DAILY: Runs every morning at 07:00
      - seconds: 0
        minutes: 0
        hours: 7
        then:
          - sensor.template.publish:
              id: bms_daily_discharge_meter
              state: 0.0

      # ==========================================
      # MONTHLY RESETS
      # ==========================================
      # CHARGE MONTHLY: Runs at 23:00 on the LAST day of every month
      # (Clears out the old month right before the night charge window starts)
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 28,29,30,31
        then:
          # This lambda ensures it only fires if tomorrow is the 1st of the month
          - lambda: |-
              auto t = id(sntp_time).now();
              t.increment_day();
              if (t.day_of_month == 1) {
                id(bms_monthly_charge_meter).publish_state(0.0);
              }

      # DISCHARGE MONTHLY: Runs at 07:00 on the 1st day of every month
      # (Clears out the old month right before the morning discharge window starts)
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 1
        then:
          - sensor.template.publish:
              id: bms_monthly_discharge_meter
              state: 0.0

      # ==========================================
      # YEARLY RESETS
      # ==========================================
      # CHARGE YEARLY: Runs at 23:00 on December 31st
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 31
        months: DEC
        then:
          - sensor.template.publish:
              id: bms_yearly_charge_meter
              state: 0.0

      # DISCHARGE YEARLY: Runs at 07:00 on January 1st
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 1
        months: JAN
        then:
          - sensor.template.publish:
              id: bms_yearly_discharge_meter
              state: 0.0
globals:
  - id: bms_last_valid_efficiency
    type: float
    restore_value: true
    initial_value: '100.0'

button:
  - platform: jk_bms_ble
    retrieve_settings:
      name: "retrieve settings"
      icon: "mdi:cog-transfer"
    retrieve_device_info:
      name: "retrieve device info"
      icon: "mdi:information-outline"
    retrieve_logbook:
      name: "retrieve logbook"
      icon: "mdi:book-open-outline"
    shutdown:
      name: "shutdown"
      icon: "mdi:power"
    restart:
      name: "restart"
      icon: "mdi:restart"
    factory_reset:
      name: "factory reset"
      icon: "mdi:factory"

  #  Bit 0  OverLoadRestartForbid   Prevents the inverter from auto-restarting after an overload fault.
  #  Bit 1  OverTempRestartForbid   Prevents the inverter from auto-restarting after an over-temperature fault.
  #  Bit 2  OverLoadBypassForbid    Forbids switching to bypass mode when an overload occurs.
  #  Bit 3  AutoTurnPageFlagForbid  Disables the automatic scrolling/turning of pages on the LCD screen.
  #  Bit 4  GridBuzzEnable          Enables the buzzer/alarm specifically when connected to Grid/Utility power (PV1800 specific).
  #  Bit 5  BuzzForbid              Completely mutes/disables the buzzer sound.
  #  Bit 6  LcdLightEnable          Keeps the LCD backlight permanently illuminated when enabled.
  #  Bit 7  RecordFaultForbid       Stops the inverter from saving or logging faults to its internal memory.
switch:
  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: Overload auto-restart disabled"
    id: inverter_OverLoadRestartForbid
    register_type: holding
    address: 20142
    bitmask: 0x0001
    icon: mdi:alert-circle-check-outline

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: Over temperature auto-restart disabled"
    id: inverter_OverTempRestartForbid
    register_type: holding
    address: 20142
    bitmask: 0x0002
    icon: "mdi:thermometer-alert"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: Go bypass when overload disabled"
    id: inverter_OverLoadBypassForbid
    register_type: holding
    address: 20142
    bitmask: 0x0004
    icon: "mdi:sine-wave" # AC Bypass functionality

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: screen page scrolling disabled"
    id: inverter_AutoTurnPageFlagForbid
    register_type: holding
    address: 20142
    bitmask: 0x0008
    icon: "mdi:page-next-outline"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: beeps when connected to grid disabled"
    id: inverter_GridBuzzEnable
    register_type: holding
    address: 20142
    bitmask: 0x0010
    icon: "mdi:transmission-tower-export" # AC Grid feed connection indicator

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: beeps are disabled"
    id: inverter_BuzzForbid
    register_type: holding
    address: 20142
    bitmask: 0x0020
    icon: "mdi:volume-mute"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: screen backlight always on"
    id: inverter_LcdLightEnable
    register_type: holding
    address: 20142
    bitmask: 0x0040
    icon: "mdi:monitor-lightbulb"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: saving errors disabled"
    id: inverter_RecordFaultForbid
    register_type: holding
    address: 20142
    bitmask: 0x0080
    icon: "mdi:database-lock"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter Reset Accumulated Values"
    register_type: holding
    address: 20213

  - platform: jk_bms_ble
    charging:
      name: "charging"
      icon: "mdi:battery-charging-wireless"
    discharging:
      name: "discharging"
      icon: "mdi:current-dc" # Core DC power draw path
    balancer:
      name: "balancer"
      icon: "mdi:scale-balance"
    emergency:
      name: "emergency"
      icon: "mdi:car-emergency"
    heating:
      name: "heating"
      icon: "mdi:heating-coil"
    disable_temperature_sensors:
      name: "disable temperature sensors"
      icon: "mdi:thermometer-off"
    display_always_on:
      name: "display always on"
      icon: "mdi:screencast"
    smart_sleep:
      name: "smart sleep"
      icon: "mdi:sleep"
    disable_pcl_module:
      name: "disable pcl module"
    timed_stored_data:
      name: "timed stored data"
    charging_float_mode:
      name: "charging float mode"
    emergency_button_trigger:
      name: "emergency button trigger"
    dry_contact_alarm_intermittent:
      name: "dry contact alarm intermittent"
    discharge_overcurrent_protection_2:
      name: "discharge overcurrent protection 2"

  - platform: ble_client
    ble_client_id: client0
    name: "enable bluetooth connection"
    id: ble_client_switch0

