      if (value & (1 << 4))  faults.push_back("Output Short Circuit");
      if (value & (1 << 5))  faults.push_back("Output Voltage Too High");
      if (value & (1 << 6))  faults.push_back("Overload Timeout");
      if (value & (1 << 7))  faults.push_back("Bus Voltage Too High");
      if (value & (1 << 8))  faults.push_back("Bus Soft Start Failed");
      if (value & (1 << 9))  faults.push_back("Main Relay Failed");
      if (value & (1 << 10)) faults.push_back("Output Voltage Sensor Error");
      if (value & (1 << 11)) faults.push_back("Grid Voltage Sensor Error");
      if (value & (1 << 12)) faults.push_back("Output Current Sensor Error");
      if (value & (1 << 13)) faults.push_back("Grid Current Sensor Error");
      if (value & (1 << 14)) faults.push_back("Load Current Sensor Error");
      if (value & (1 << 15)) faults.push_back("Grid Current Too High");
      
      if (faults.empty()) {
        return {"Normal"};
