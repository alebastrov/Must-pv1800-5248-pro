# Board: NodeMCU-32S (NodeMCU) Definition: definitions/boards/nodemcu-32s/manifest.yaml
# also see https://github.com/MarkNjunge/must-inverter-monitor/blob/master/main.py
# https://github.com/softwarecrash/Solar2MQTT/wiki/Wiring-Diagram
substitutions:
  mac_address: !secret jk_bms_mac_address
  inverter_id: inverter1
  updates_inverter: 2000ms
  updates_bms: 2000ms
  TELEGRAM_BOT_TOKEN: !secret my_telegram_token

external_components:
  # - source:
  #     type: git
  #     url: https://github.com/syssi/esphome-jk-bms
  #     ref: main
  - source:
      type: local
      path: components
      #url: https://github.com/syssi/esphome-jk-bms

esphome:
  name: must-pv1800
  friendly_name: inverter-monitor
  includes:
    - sender.h
    - history.h

esp32:
  variant: ESP32
  board: nodemcu-32s
  flash_size: 4MB
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true
    # Allocates a larger stack size to safely handle BLE tasks alongside Modbus
    sdkconfig_options:
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "8192"

api:
  encryption:
    key: "QH6ezYpMxSAzm8qHo1hbwjpCY1EM/hKUbNftqaC3vwE="
  reboot_timeout: 15min # Prevents the ESP32 from rebooting if Wi-Fi glitches briefly

ota:
  - platform: esphome
    encryption:

preferences:
  flash_write_interval: 60min

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE

  ap:
    ssid: "Inverter-BMS-WiFi"
    password: "12345678"

logger:
  level: WARN
  hardware_uart: UART0
  tx_buffer_size: 256
  logs:
    modbus: WARN
    modbus_controller: WARN

mdns:
  disabled: true       # Disables network name caching, saving heap RAM

esp32_ble:
  max_connections: 1       # Slashes RAM allocated for concurrent links
  max_notifications: 15     # Limits memory slots for data stream subscriptions

esp32_ble_tracker:
  scan_parameters:
    duration: 5s
    interval: 150ms
    window: 30ms
    active: false

ble_client:
  mac_address: ${mac_address}
  id: client0

jk_bms_ble:
  - ble_client_id: client0
    protocol_version: JK02_32S
    throttle: 2s
    id: bms0
    update_interval: ${updates_bms}

web_server:
  port: 80
  local: true

status_led:
  pin:
    number: GPIO2
    ignore_strapping_warning: true

uart:
  - id: uart_inverter
    baud_rate: 19200
    tx_pin: GPIO23
    rx_pin: GPIO22
    stop_bits: 1
    parity: NONE
    rx_full_threshold: 1
    rx_timeout: 2
    rx_buffer_size: 1024

modbus:
  - id: modbus_0
    uart_id: uart_inverter
    send_wait_time: 500ms
    turnaround_time: 100ms

modbus_controller:
  - id: must_inverter
    address: 0x04
    modbus_id: modbus_0
    setup_priority: -10
    max_cmd_retries: 2
    update_interval: ${updates_inverter}
  - id: must_inverter_slow
    address: 0x04
    modbus_id: modbus_0
    setup_priority: -10
    max_cmd_retries: 5
    update_interval: 30s
  - id: must_inverter_super_slow
    address: 0x04
    modbus_id: modbus_0
    setup_priority: -10
    max_cmd_retries: 5
    update_interval: 15min # Reads only once every 15 minutes!

time:
  - platform: sntp
    id: sntp_time
    on_time:
      # ==========================================
      # DAILY CYCLE RESETS
      # ==========================================
      # CHARGE DAILY: Runs every night at 23:00
      - seconds: 0
        minutes: 0
        hours: 23
        then:
          - component.update: bms_battery_ratio
          - sensor.template.publish:
              id: bms_daily_charge_meter
              state: 0.0
          - sensor.template.publish:
              id: bms_daily_discharge_meter
              state: 0.0
          - lambda: |-
              id(battery_in_rest_period) = false;
              id(permanent_shutdown_active) = false;
          - logger.log: "Global variables and daily meters have been reset at 23:00:00"

      # ==========================================
      # MONTHLY RESETS
      # ==========================================
      # CHARGE/DISCHARGE MONTHLY: Runs at 23:00 on the LAST day of every month
      # (Clears out the old month right before the night charge window starts)
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 28,29,30,31
        then:
          # This lambda ensures it only fires if tomorrow is the 1st of the month
          - lambda: |-
              auto t = id(sntp_time).now();
              t.increment_day();
              if (t.day_of_month == 1) {
                id(bms_monthly_charge_meter).publish_state(0.0f);
                id(bms_monthly_discharge_meter).publish_state(0.0f);
              }

      # ==========================================
      # YEARLY RESETS
      # ==========================================
      # CHARGE/DISCHARGE YEARLY: Runs at 23:00 on December 31st
      - seconds: 0
        minutes: 0
        hours: 23
        days_of_month: 31
        months: DEC
        then:
          - sensor.template.publish:
              id: bms_yearly_charge_meter
              state: 0.0
          - sensor.template.publish:
              id: bms_yearly_discharge_meter
              state: 0.0

http_request:
  id: bms_http_client
  timeout: 10s
  verify_ssl: false
  buffer_size_rx: 2048
  buffer_size_tx: 1024

globals:
  - id: bms_last_valid_efficiency
    type: float
    restore_value: true
    initial_value: '100.0'
  - id: battery_in_rest_period
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: permanent_shutdown_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: protection_history_list
    type: std::vector<std::string>
    initial_value: 'std::vector<std::string>()'

button:
  - platform: template
    name: "Inverter switch: Reset accumulated values"
    id: inverter_ResetAccumValues
    icon: mdi:refresh
    on_press:
      then:
        - switch.turn_on: inverter_reset_register_wire
        - switch.turn_off: inverter_reset_register_wire
        - component.update: must_inverter_super_slow

        - lambda: !lambda |-
            uint8_t current_address = 0x04;
            std::string log_msg = "Inverter Accumulated Values were reset (Slave ID: " + std::to_string(current_address) + ")";
            add_to_history(id(sntp_time), id(protection_history_sensor), log_msg);

  - platform: jk_bms_ble
    retrieve_settings:
      id: "bms_retrieve_settings"
      name: "BMS retrieve settings"
      icon: "mdi:cog-transfer"
    retrieve_device_info:
      id: "bms_retrieve_device_info"
      name: "BMS retrieve device info"
      icon: "mdi:information-outline"
    retrieve_logbook:
      id: "bms_retrieve_logbook"
      name: "BMS retrieve logbook"
      icon: "mdi:book-open-outline"
    shutdown:
      id: "bms_shutdown"
      name: "BMS shutdown"
      icon: "mdi:power"
    restart:
      id: "bms_restart"
      name: "BMS restart"
      icon: "mdi:restart"
    factory_reset:
      id: "bms_factory_reset"
      name: "BMS factory reset"
      icon: "mdi:factory"

  - platform: template
    name: "BMS: Clear Fault & Resume Charge"
    id: bms_recover_from_avoiding_charging
    icon: "mdi:battery-refresh"
    on_press:
      then:
        - lambda: |-
            if (id(permanent_shutdown_active) || id(battery_in_rest_period)) {
              // 1. blocking was fired 
              // 2. reset flags
              id(permanent_shutdown_active) = false;
              id(battery_in_rest_period) = false;

              // 3. report that even
              char msg_buffer[512];
              snprintf(msg_buffer, sizeof(msg_buffer), 
                "🔄 *BMS Recovery:* Fault cleared manually.\\nResuming normal charging operations.");
              add_to_history(id(sntp_time), id(protection_history_sensor), msg_buffer);
            
              std::string token = "$TELEGRAM_BOT_TOKEN";
              log_and_send_tg("safety", msg_buffer, token, id(bms_http_client));

              // 4. set charging current as it was before blocking
              id(evaluate_charging_safety).execute();
            } else {
              // accidentally clicked, ignore
              ESP_LOGI("safety", "Manual recovery pressed, but no active faults detected.");
            }

  - platform: template
    name: "Log Battery Status"
    id: send_status_button
    icon: "mdi:battery-arrow-up"
    on_press:
      then:
        - lambda: |-
            // Create a buffer for your text message
            char msg_buffer[128];
            
            // Fetch the state of your existing 'precise_soc' sensor
            float current_soc = id(precise_soc).state;
            
            // Format the message string (using HTML formatting to avoid markdown escaping errors)
            snprintf(msg_buffer, sizeof(msg_buffer), 
              "🔋 Battery Status Update"
              "• Current SoC: %.1f%%", 
              current_soc
            );
            
            std::string token = "$TELEGRAM_BOT_TOKEN";
            // Send the message using your logging function
            log_and_send_tg("status_request", msg_buffer, token, id(bms_http_client));

  #  Bit 0  OverLoadRestartForbid   Prevents the inverter from auto-restarting after an overload fault.
  #  Bit 1  OverTempRestartForbid   Prevents the inverter from auto-restarting after an over-temperature fault.
  #  Bit 2  OverLoadBypassForbid    Forbids switching to bypass mode when an overload occurs.
  #  Bit 3  AutoTurnPageFlagForbid  Disables the automatic scrolling/turning of pages on the LCD screen.
  #  Bit 4  GridBuzzEnable          Enables the buzzer/alarm specifically when connected to Grid/Utility power (PV1800 specific).
  #  Bit 5  BuzzForbid              Completely mutes/disables the buzzer sound.
  #  Bit 6  LcdLightEnable          Keeps the LCD backlight permanently illuminated when enabled.
  #  Bit 7  RecordFaultForbid       Stops the inverter from saving or logging faults to its internal memory.
switch:
  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    id: inverter_reset_register_wire
    register_type: holding
    address: 20213 # or maybe 57092
    internal: true
  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: Overload auto-restart disabled"
    id: inverter_OverLoadRestartForbid
    register_type: holding
    address: 20142
    bitmask: 0x0001
    icon: mdi:alert-circle-check-outline

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: Over temperature auto-restart disabled"
    id: inverter_OverTempRestartForbid
    register_type: holding
    address: 20142
    bitmask: 0x0002
    icon: "mdi:thermometer-alert"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: Go bypass when overload disabled"
    id: inverter_OverLoadBypassForbid
    register_type: holding
    address: 20142
    bitmask: 0x0004
    icon: "mdi:sine-wave" # AC Bypass functionality

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: screen page scrolling disabled"
    id: inverter_AutoTurnPageFlagForbid
    register_type: holding
    address: 20142
    bitmask: 0x0008
    icon: "mdi:page-next-outline"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: beeps when connected to grid disabled"
    id: inverter_GridBuzzEnable
    register_type: holding
    address: 20142
    bitmask: 0x0010
    icon: "mdi:transmission-tower-export" # AC Grid feed connection indicator

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: beeps are disabled"
    id: inverter_BuzzForbid
    register_type: holding
    address: 20142
    bitmask: 0x0020
    icon: "mdi:volume-mute"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: screen backlight always on"
    id: inverter_LcdLightEnable
    register_type: holding
    address: 20142
    bitmask: 0x0040
    icon: "mdi:monitor-lightbulb"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    name: "Inverter switch: saving errors disabled"
    id: inverter_RecordFaultForbid
    register_type: holding
    address: 20142
    bitmask: 0x0080
    icon: "mdi:database-lock"

