    name: "Inverter PV Charger Accumulated hour"
    unit_of_measurement: "Hours"
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:flash
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 15221
    register_type: holding
    name: "Inverter PV Charger Accumulated minute"
    unit_of_measurement: "Minutes"
    device_class: duration
    accuracy_decimals: 0
    icon: mdi:flash
    reuse_previous_range: false
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 25201
    register_type: holding
    name: "Inverter Work State"
    id: inverter_work_state
    internal: true
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 25205
    name: "Inverter Battery Voltage"
    register_type: holding
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
