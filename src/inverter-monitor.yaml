    state_class: total
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 10s # Fallback timeframe to recalculate safely
    lambda: |-
      if (isnan(id(capacity_remaining).state) || isnan(id(full_charge_capacity).state)) {
        if (!isnan(id(state_of_charge).state)) {
          return id(state_of_charge).state;
        }
        return {}; // Return absolutely nothing (prevents "nan %" log spam)
      }
      if (id(capacity_remaining).state > 0 && id(full_charge_capacity).state > 0) {
        return (id(capacity_remaining).state / id(full_charge_capacity).state) * 100.0;
      }
      if (!std::isnan(id(state_of_charge).state)) {
