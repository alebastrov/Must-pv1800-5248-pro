        }
        return {}; // Return absolutely nothing (prevents "nan %" log spam)
      }
      if (id(capacity_remaining).state > 0 && id(full_charge_capacity).state > 0) {
        return (id(capacity_remaining).state / id(full_charge_capacity).state) * 100.0;
      }
      if (!std::isnan(id(state_of_charge).state)) {
