sensor:
  - platform: template
    name: "BMS DischargeToCharge Cycle Ratio"
    id: bms_battery_ratio
    update_interval: never # Only updates when triggered right before the reset
    unit_of_measurement: "%"
    accuracy_decimals: 2
    icon: "mdi:battery-heart-variant"
    lambda: |-
      float charge = id(bms_daily_charge_meter).state;
      float discharge = id(bms_daily_discharge_meter).state;
      
      if (charge > 0.0) {
        return (discharge / charge) * 100.0;
      } else {
        return 0.0;
      }

  #Inverter Control Message
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 20004
    register_type: holding
    name: "Inverter Hardware version"
    filters:
      - throttle: 200s
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 20005
    register_type: holding
    name: "Inverter Software version"
    filters:
      - throttle: 200s

  # Inverter BMS section if connected
  # Block 1xx (External BMS)
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 109
    register_type: holding
    name: "Inverter (Read from BMS) Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    filters:
      multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 110
    register_type: holding
    name: "Inverter (Read from BMS) Battery Current"
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    filters:
      multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 111
    register_type: holding
    name: "Inverter (Read from BMS) Battery Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    filters:
      - throttle: 30s

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 112
    register_type: holding
    name: "Inverter (Read from BMS) Battery Error"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
