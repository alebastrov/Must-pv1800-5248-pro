  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    address: 15216
    register_type: holding
    value_type: S_WORD
    name: "Inverter Grade Rated Current"
    unit_of_measurement: "A"
    device_class: current
    icon: mdi:current-dc
    reuse_previous_range: false
    filters:
        multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    address: 15217
    register_type: holding
    id: charger_total_mwh
    unit_of_measurement: MWh
    device_class: energy
    internal: true
    filters:
      - throttle: 10s

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 15218
    register_type: holding
    id: charger_total_kwh
    unit_of_measurement: kWh
    device_class: energy
    internal: true
    filters:
      multiply: 0.1

  - platform: template
    name: "Inverter PV Charger Accumulated Charger Power"
    unit_of_measurement: kWh
    device_class: energy
    lambda: !lambda 'return (id(charger_total_mwh).state * 1000.0 + id(charger_total_kwh).state );'
