text_sensor:
  - platform: template
    name: "Protection: history (last 10)"
    id: protection_history_sensor
    icon: "mdi:history"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 15201
    name: "Inverter PV Charger work state"
    id: pv_charger_work_state
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = (data[0] << 8) | data[1];
      switch(value) {
        case 0: return {"Off / Initializing"};
        case 1: return {"Self-test / Standby"};
        case 2: return {"On / PV Charging"};
        case 3: return {"Off / Charging Complete"};
        case 4: return {"Fault"};
        default: return {"Unknown State"};
      }

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 15202
    name: "Inverter PV Charger MPPT state"
    internal: true
    id: pv_charger_mppt_state
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = (data[0] << 8) | data[1];
      switch(value) {
        case 0: return {"Stop / Idle"};
        case 1: return {"MPPT"};
        case 2: return {"Current Limiting"};
        default: return {"Unknown State"};
      }

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    id: pv_charger_charging_state
    name: "Inverter PV Charger Charging state"
    register_type: holding
    icon: mdi:battery-charging
    address: 15203
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = (data[0] << 8) | data[1];
      switch(value) {
        case 0: return {"Stop / Idle"};
        case 1: return {"Absorption"};
        case 2: return {"Floating"};
        case 3: return {"Equalization"};
        default: return {"Unknown State"};
      }

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    address: 15213
    register_type: holding
    name: "Inverter PV Charger error message"
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = (data[0] << 8) | data[1];
      std::vector<std::string> faults;
      
      if (value & (1 << 0))  faults.push_back("Hardware Protection");
      if (value & (1 << 1))  faults.push_back("Over Current");
      if (value & (1 << 2))  faults.push_back("Current Sensor Error");
      if (value & (1 << 3))  faults.push_back("Over Temperature");
      if (value & (1 << 4))  faults.push_back("PV Voltage Too High");
      if (value & (1 << 5))  faults.push_back("PV Voltage Too Low");
      if (value & (1 << 6))  faults.push_back("Battery Voltage Too High");
      if (value & (1 << 7))  faults.push_back("Battery Voltage Too Low");
      if (value & (1 << 8))  faults.push_back("Current Uncontrollable");
      if (value & (1 << 9))  faults.push_back("Parameter Error");
      // Bits 10 to 15 are reserved
      
      if (faults.empty()) {
        return {"Normal"};
      }
      
      // Join all detected faults into a comma-separated list
      std::string output = "";
      for (size_t i = 0; i < faults.size(); ++i) {
        if (i > 0) output += ", ";
        output += faults[i];
      }
      return {output};

  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    address: 15214
    register_type: holding
    name: "Inverter PV Charger warning message"
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = (data[0] << 8) | data[1];
      std::vector<std::string> faults;
      
      if (value & (1 << 0))  faults.push_back("Fan Error");
      // Bits 1 to 15 are reserved
      
      if (faults.empty()) {
        return {"Normal"};
      }
      
      // Join all detected faults into a comma-separated list
      std::string output = "";
      for (size_t i = 0; i < faults.size(); ++i) {
        if (i > 0) output += ", ";
        output += faults[i];
      }
      return {output};

  # 2. Extract Bits 6 & 7 for Battery Use
  - platform: template
    name: "Inverter Arrow: Battery Use"
    icon: "mdi:arrow-right-bold"
    lambda: |-
      if (std::isnan(id(inverter_arrows_raw).state)) {
        return {"Unknown"};
      }
      
      // Force state to an integer, shift right by 6, and look at the last 2 bits (mask 0x03)
      uint16_t raw_value = (uint16_t)id(inverter_arrows_raw).state;
      uint8_t battery_bits = (raw_value >> 6) & 0x03;
      
      switch (battery_bits) {
        case 0: return {"No Battery"};
        case 1: return {"Machine to Battery"};
        case 2: return {"Battery to Machine"};
        case 3: return {"Battery"};
        default: return {"Unknown"};
      }

  # 3. Extract Bits 8 & 9 for Grid Use
  - platform: template
    name: "Inverter Arrow: Grid Use"
    icon: "mdi:arrow-right-bold"
    lambda: |-
      if (std::isnan(id(inverter_arrows_raw).state)) {
        return {"Unknown"};
      }
      
      // Force state to an integer, shift right by 8, and look at the last 2 bits (mask 0x03)
      uint16_t raw_value = (uint16_t)id(inverter_arrows_raw).state;
      uint8_t grid_bits = (raw_value >> 8) & 0x03;
      
      switch (grid_bits) {
        case 0: return {"No Grid"};
        case 1: return {"Machine to Grid"};
        case 2: return {"Grid to Machine"};
        case 3: return {"Grid"};
        default: return {"Unknown"};
      }

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter Machine Type"
    address: 20000
    register_type: holding
    response_size: 4 # 2 registers at the same time = 4 bytes of total data
    lambda: |-
      // High register characters (e.g., 20566 -> 0x5056 -> 'P', 'V')
      char high_char1 = data[0]; 
      char high_char2 = data[1]; 

      // Low register characters (e.g., 18488 -> 0x4838 -> '1', '8', and '00')
      char low_char1 = data[2];  
      char low_char2 = data[3];  

      // 2. Format everything cleanly into an ASCII string output
      char buffer[16];
      if (std::isalnum(low_char1) && std::isalnum(low_char2)) {
        snprintf(buffer, sizeof(buffer), "%c%c%c%c00", high_char1, high_char2, low_char1, low_char2);
      } else {
        // Fallback calculation helper if Low Register returns raw numerical short integer format 1800
        uint16_t low_val = (data[2] << 8) | data[3];
        snprintf(buffer, sizeof(buffer), "%c%c%d", high_char1, high_char2, low_val);
      }
      return {buffer};

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 20005
    register_type: holding
    name: "Inverter Communication Protocol version"
    icon: "mdi:code-braces"
    lambda: |-
      int value = id(protocol_version_raw).state;
      int major = value / 10000;
      int minor = (value / 100) % 100;
      int patch = value % 100;
      
      char buffer[16];
      sprintf(buffer, "%d.%02d.%02d", major, minor, patch);
      return {buffer};

  - platform: modbus_controller
