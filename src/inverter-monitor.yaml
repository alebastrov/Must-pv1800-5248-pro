      std::vector<std::string> faults;
      
      if (value & (1 << 0))  faults.push_back("Fan Locked");
      if (value & (1 << 1))  faults.push_back("Transformer Over Temperature");
      if (value & (1 << 2))  faults.push_back("Battery Voltage Too High");
