sensor:
  - platform: template
    name: "BMS DischargeToCharge Cycle Ratio"
    id: bms_battery_ratio
    update_interval: never # Only updates when triggered right before the reset
    unit_of_measurement: "%"
    accuracy_decimals: 2
    icon: "mdi:battery-heart-variant"
    lambda: |-
      float charge = id(bms_daily_charge_meter).state;
      float discharge = id(bms_daily_discharge_meter).state;
      
      if (charge > 0.0) {
        return (discharge / charge) * 100.0;
      } else {
        return 0.0;
      }
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    id: inverter_arrows_raw
    address: 25279
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    # internal: true  # Uncomment this line if you want to hide the raw number from Home Assistant

  #Inverter Control Message
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 20004
    register_type: holding
    name: "Inverter Hardware version"
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 20005
    register_type: holding
    name: "Inverter Software version"

  #Inverter Display Message
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 10103
    register_type: holding
    name: "Inverter Charge Floating Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 10104
    register_type: holding
    name: "Inverter Charge Absorption Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    filters:
      multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 10105
    register_type: holding
    name: "Inverter Active Load Power"
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 0
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 15201
    name: "Inverter PV Charger work state"
    id: pv_charger_work_state
    internal: true
    register_type: holding
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 15202
    name: "Inverter PV Charger MPPT state"
    internal: true
    id: pv_charger_mppt_state
    register_type: holding
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 15203
    name: "Inverter PV Charger Charging state"
    id: pv_charger_charging_state
    internal: true
    register_type: holding
  # 15204 reserved
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 15205
    name: "Inverter PV Charger Voltage"
    register_type: holding
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    icon: mdi:current-dc
    filters:
      multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 15206
    name: "Inverter PV Charger Battery Voltage"
    register_type: holding
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    icon: mdi:current-dc
    filters:
      multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 15207
    name: "Inverter PV Charger Current"
    register_type: holding
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    icon: mdi:current-dc
    filters:
      multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 15208
    register_type: holding
    name: "Inverter PV Charger Power"
    id: pv_charger_power
    unit_of_measurement: "W"
    device_class: power
    accuracy_decimals: 1
    icon: mdi:flash
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 15209
    register_type: holding
    id: pv_charger_radiator_temperature
    name: "Inverter PV Charger Radiator temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    icon: mdi:temperature-celsius
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 15210
    register_type: holding
    name: "Inverter PV Charger External temperature"
    id: pv_charger_external_temperature
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    icon: mdi:temperature-celsius
  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    address: 15213
    register_type: holding
    name: "Inverter Error Messages Count"
  - platform: modbus_controller
    modbus_controller_id: must_inverter_super_slow
    address: 15214
    register_type: holding
    name: "Inverter Warning Messages Count"
