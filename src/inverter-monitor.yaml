    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 1
    icon: mdi:sine-wave
    filters:
      multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 25207
    name: "Inverter Grid Voltage"
    register_type: holding
    unit_of_measurement: "V"
    device_class: voltage
