script:
  # MAIN EVALUATION: Controls baseline operations and manages dynamic high-delta interventions
  - id: evaluate_charging_safety
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              // Added safety checking to prevent NaN errors on the new threshold sensors
              if (id(target_charging_current_select).current_option().empty() || 
                  std::isnan(id(delta_cell_voltage).state) ||
                  std::isnan(id(input_delta_trigger_threshold).state) ||
                  std::isnan(id(input_max_cell_voltage).state) ||
                  std::isnan(id(inverter_charger_current).state) ||
                  std::isnan(id(max_cell_voltage).state) ||
                  std::isnan(id(bms_battery_voltage).state)) {
                return false;
              }
              // Lock down execution completely if a permanent low-current shutdown was flagged
              if (id(permanent_shutdown_active)) return false;
              return true;
          then:
            - lambda: |-
                float cell_delta = id(delta_cell_voltage).state;
                float trigger_v = id(input_delta_trigger_threshold).state;
                float active_current = id(inverter_charger_current).state;
              
                int bad_cell_num = (int)id(max_voltage_cell).state;
                float bad_cell_v = id(max_cell_voltage).state;
                float max_allowed_cell_v = id(input_max_cell_voltage).state;
                
                float max_allowed_batt_v = id(input_max_battery_voltage).state;
                float total_batt_v = id(bms_battery_voltage).state;

                char msg_buffer[512];

                // check if High Delta or Overvoltage Cell or Overvoltage Pack
                bool trigger_intervention = (cell_delta >= trigger_v) || 
                                            (bad_cell_v >= max_allowed_cell_v) || 
                                            (total_batt_v >= max_allowed_batt_v);

                // 1. CRITICAL OVER-PARAMETER INTERVENTION
                if (trigger_intervention) {
                  if (!id(battery_in_rest_period)) {
                    char reason_buffer[128];

                    // add details
                    if (bad_cell_v >= max_allowed_cell_v) {
                      snprintf(reason_buffer, sizeof(reason_buffer), "BMS Max Cell #%d Voltage Limit (>= %.3f V)", bad_cell_num, max_allowed_cell_v);
                      add_to_history(id(sntp_time), id(protection_history_sensor), reason_buffer);
                    } else if (total_batt_v > max_allowed_batt_v) {
                      snprintf(reason_buffer, sizeof(reason_buffer), "BMS Pack Battery Voltage Limit (>= %.2f V)", max_allowed_batt_v);
                      add_to_history(id(sntp_time), id(protection_history_sensor), reason_buffer);
                    } else {
                      snprintf(reason_buffer, sizeof(reason_buffer), "BMS Cell Delta Threshold Exceeded (>= %.3f V)", trigger_v);
                      add_to_history(id(sntp_time), id(protection_history_sensor), reason_buffer);
                    }

                    if (active_current < 2.0f) {
                      // Charging current has already been lesser than 2A      
                      snprintf(msg_buffer, sizeof(msg_buffer), 
                        "🚨 *CRITICAL: PERMANENT SHUTDOWN*\\n"
                        "Battery is saturated (Current < 2A with High Cell/Delta/Pack Max).\\n"
                        "Reason: %s\\n\\n"
                        "📈 *Metrics:*\\n"
                        "• Cell Delta: %.3f V\\n"
                        "• Current: %.1f A\\n"
                        "• Battery Voltage: %.2f V\\n"
                        "• *Bad Cell: #%d (%.3f V)*\\n\\n"
                        "Charging stopped completely until manual intervention.", 
                        reason_buffer, cell_delta, active_current, total_batt_v, bad_cell_num, bad_cell_v);
                        add_to_history(id(sntp_time), id(protection_history_sensor), reason_buffer);
                      
                      std::string token = "$TELEGRAM_BOT_TOKEN";
                      log_and_send_tg("safety", msg_buffer, token, id(bms_http_client));

                      id(permanent_shutdown_active) = true;
                      
                      auto call = id(inverter_charger_current).make_call();
                      call.set_value(1.0f); // Forces the inverter to its absolute lowest possible state
                      call.perform();
                      return;
                    }
                    // Charging current is more than 2A, go to dynamic rest 15 min
                    const char* reason = "Cell Delta / Overvoltage Threshold Exceeded";
                    snprintf(msg_buffer, sizeof(msg_buffer), 
                      "⚠️ *WARNING: DYNAMIC RECOVERY*\\n"
                      "Threshold breach detected. Dropping current for a 15m rest.\\n"
                      "Reason: %s\\n\\n"
                      "📈 *Metrics:*\\n"
                      "• Cell Delta: %.3f V\\n"
                      "• Current Before: %.1f A\\n"
                      "• Pack Voltage: %.2f V\\n"
                      "• *Highest Cell: #%d (%.3f V)*", 
                      reason, cell_delta, active_current, total_batt_v, bad_cell_num, bad_cell_v);
                    add_to_history(id(sntp_time), id(protection_history_sensor), reason_buffer);
                
                    std::string token = "$TELEGRAM_BOT_TOKEN";                    
                    log_and_send_tg("safety", msg_buffer, token, id(bms_http_client));

                    id(battery_in_rest_period) = true;
                    
                    auto call = id(inverter_charger_current).make_call();
                    call.set_value(1.0f);
                    call.perform();

                    id(cooldown_rest_timer).execute();
                  }
                  return;
                }

  # COOLDOWN COUNTDOWN TIMER (Only fires for high-current delta events)
  - id: cooldown_rest_timer
    mode: single
    then:
      - delay: 15min
      - lambda: |-
          ESP_LOGI("safety", "15-minute battery cooldown elapsed. Resuming normal operations.");
          add_to_history(id(sntp_time), id(protection_history_sensor), "(OK) Battery is under protection");
          id(battery_in_rest_period) = false;
          id(evaluate_charging_safety).execute();
