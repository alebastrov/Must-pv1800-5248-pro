# Board: NodeMCU-32S (NodeMCU)
# Definition: definitions/boards/nodemcu-32s/manifest.yaml

esphome:
  name: must-pv1800
  friendly_name: MUST pv1800

esp32:
  variant: ESP32
  board: nodemcu-32s
  flash_size: 4MB
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

api:
  encryption:
    key: "QH6ezYpMxSAzm8qHo1hbwjpCY1EM/hKUbNftqaC3vwE="
  reboot_timeout: 15min

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

logger:
  level: INFO
  hardware_uart: UART0
  logs:
    modbus: INFO
    modbus_controller: INFO

substitutions:
  inverter_id: inverter1
  updates_inverter: 5s

#status_led:
#  pin:
#    number: GPIO2
#    inverted: false

web_server:
  port: 80
  local: true


# Registers the LED to flash automatically on system activity
status_led:
  pin: GPIO2

uart:
  - id: uart_inverter
    baud_rate: 19200
    rx_buffer_size: 384
    tx_pin: GPIO23
    rx_pin: GPIO22
    stop_bits: 1
    parity: NONE

modbus:
  - id: modbus_0
    uart_id: uart_inverter
    send_wait_time: 200ms
    turnaround_time: 80ms

modbus_controller:
  - id: must_inverter
    address: 0x04
    modbus_id: modbus_0
    setup_priority: -10
    max_cmd_retries: 5
    update_interval: ${updates_inverter}
    command_throttle: 150ms

  - id: must_inverter_slow
    address: 0x04           # Uses the exact same Modbus slave address
    modbus_id: modbus_0
    update_interval: 15min # Reads only once every 15 minutes!




  #  Bit 0  OverLoadRestartForbid   Prevents the inverter from auto-restarting after an overload fault.
  #  Bit 1  OverTempRestartForbid   Prevents the inverter from auto-restarting after an over-temperature fault.
  #  Bit 2  OverLoadBypassForbid    Forbids switching to bypass mode when an overload occurs.
  #  Bit 3  AutoTurnPageFlagForbid  Disables the automatic scrolling/turning of pages on the LCD screen.
  #  Bit 4  GridBuzzEnable          Enables the buzzer/alarm specifically when connected to Grid/Utility power (PV1800 specific).
  #  Bit 5  BuzzForbid              Completely mutes/disables the buzzer sound.
  #  Bit 6  LcdLightEnable          Keeps the LCD backlight permanently illuminated when enabled.
  #  Bit 7  RecordFaultForbid       Stops the inverter from saving or logging faults to its internal memory.
switch:
  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter switch: Overload auto-restart disabled"
    id: inverter_OverLoadRestartForbid
    register_type: holding
    address: 20142
    bitmask: 0x0001 #Bit 0

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter switch: Over temperature auto-restart disabled"
    id: inverter_OverTempRestartForbid
    register_type: holding
    address: 20142
    bitmask: 0x0002 # Bit 1

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter switch: Go bypass when overload disabled"
    id: inverter_OverLoadBypassForbid
    register_type: holding
    address: 20142
    bitmask: 0x0004 # Bit 2

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter switch: screen page scrolling disabled"
    id: inverter_AutoTurnPageFlagForbid
    register_type: holding
    address: 20142
    bitmask: 0x0008 # Bit 3

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter switch: beeps when connected to grid disabled"
    id: inverter_GridBuzzEnable
    register_type: holding
    address: 20142
    bitmask: 0x0010 # Bit 4

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter switch: beeps are disabled"
    id: inverter_BuzzForbid
    register_type: holding
    address: 20142
    bitmask: 0x0020 # Bit 5

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter switch: screen backlight always on"
    id: inverter_LcdLightEnable
    register_type: holding
    address: 20142
    bitmask: 0x0040 # Bit 6

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    name: "Inverter switch: saving errors disabled"
    id: inverter_RecordFaultForbid
    register_type: holding
    address: 20142
    bitmask: 0x0080 # Bit 7

