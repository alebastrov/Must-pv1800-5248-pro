  # уровень вайфай сигнала
  - platform: wifi_signal
    name: "Inverter WiFi signal"
    entity_category: diagnostic
    device_class: signal_strength
    id: wifi_sig
    update_interval: 60s
    filters:
      - lambda: return x + 100.0;
    unit_of_measurement: "%"


text_sensor:
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    bitmask: 0
    register_type: holding
    address: 25261
    raw_encode: ANSI
    name: "Inverter error message 1"

  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 25262
    raw_encode: ANSI
    register_type: holding
    name: "Inverter error message 2"

  - platform: modbus_controller
    modbus_controller_id: must_inverter
    address: 25263
    raw_encode: ANSI
    register_type: holding
    name: "Inverter error message 3"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 25265
    register_type: holding
    raw_encode: ANSI
    name: "Inverter warning message 1"

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    register_type: holding
    address: 25266
    raw_encode: ANSI
    name: "Inverter warning message 2"

  - platform: wifi_info
    ip_address:
      name: Device IP Address
    ssid:
      name: Device Connected SSID
    bssid:
      name: Device Connected BSSID
    mac_address:
      name: Device Mac Wifi Address

  - platform: template
    name: "Inverter Work Mode"
    id: inverter_work_mode
    icon: "mdi:solar-power"
    update_interval: 10s
    lambda: |-
      int raw_state = id(inverter_work_state).state;
      switch(raw_state) {
        case 0:  return {"Power On / Initializing"};
        case 1:  return {"Self-Test"};
        case 2:  return {"Off-Grid"};
        case 3:  return {"Grid-Tie"};
        case 4:  return {"Bypass"};
        case 5:  return {"Stop / Fault"};
        case 6:  return {"Grid Charging"};
        default: return "Unknown inverter work status value (" + to_string(raw_state) + ")";
      }

  - platform: template
    name: "Inverter PV Charger MPPT Mode"
    id: inverter_charger_mppt_mode
    icon: "mdi:solar-power"
    update_interval: 10s
    lambda: |-
      int raw_state = id(pv_charger_mppt_state).state;
      switch(raw_state) {
        case 0:  return {"Off / Idle"};
        case 1:  return {"Active"};
        case 2:  return {"Current Limiting"};
        default: return "Unknown PV Charger MPPT state value (" + to_string(raw_state) + ")";
      }

  - platform: template
    name: "Inverter PV Charger Work Mode"
    id: pv_charger_work_mode
    icon: "mdi:solar-power-variant"
    update_interval: 10s
    lambda: |-
      int raw_state = id(pv_charger_work_state).state;
      switch(raw_state) {
        case 0:  return {"Off / Initializing"};
        case 1:  return {"Standby"};
        case 2:  return {"PV Charging"};
        case 3:  return {"Charging Complete"};
        case 4:  return {"Stop / Fault"};
        default: return "Unknown PV Charger work state value (" + to_string(raw_state) + ")";
      }

select:
  - platform: modbus_controller
    modbus_controller_id: must_inverter
    id: energy_use_mode
    name: "Inverter Energy Use Mode"
    address: 20109
    optionsmap:
      "SBU (Solar/battery/utility)": 1
      "SUB (Solar/utility/battery)": 2
      "UTI (Utility only)": 3
      "SOL (Solar only)": 4

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    id: charger_source_priority
    name: "Inverter Charger Source Priority"
    address: 20143
    optionsmap:
      "CSO (Solar first)": 0
      "SNU (Solar and utility)": 2
      "OSO (Solar only)": 3

  - platform: modbus_controller
    modbus_controller_id: must_inverter_slow
    address: 20111
    id: inverter_ac_input_voltage_range
    name: "Inverter AC input Voltage Range"
    optionsmap:
      "VDE (184-253 VAC)": 0
      "UPS (170-280 VAC)": 1
      "APL (90-280 VAC)": 2
      "GEN (Generator)": 3

